# 用法:
#   1. 把 tools/lkm/oplus_tp_helper/ 复制到 KernelSU-Next 仓库根目录（名字保持 oplus_tp_helper）
#   2. 把这个文件复制到 .github/workflows/build-oplus-tp-helper.yml
#   3. push 后在 Actions 里手动 Run workflow
name: Build oplus_tp_helper LKM

on:
  workflow_dispatch:

jobs:
  build-oplus-tp-helper:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build LKMs
        run: |
          set -e
          echo "KDIR=$KDIR"
          if [ -z "$KDIR" ] || [ ! -f "$KDIR/Makefile" ]; then
            echo "::error::KDIR is not a prepared kernel build tree"
            exit 1
          fi
          for d in oplus_tp_helper oplus_gyro_helper; do
            [ -d "$d" ] || continue
            echo "=== $d ==="
            make -C "$KDIR" M="$PWD/$d" ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 modules -j"$(nproc)"
            test -f "$d/$d.ko"
            llvm-strip -d "$d/$d.ko" || true
            ls -la "$d/$d.ko"
          done

      - name: Upload LKM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oplus-tp-helper-lkm
          path: |
            oplus_tp_helper/oplus_tp_helper.ko
            oplus_gyro_helper/oplus_gyro_helper.ko
          if-no-files-found: error
